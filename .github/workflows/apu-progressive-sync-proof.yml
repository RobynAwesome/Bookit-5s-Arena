name: KPGS Progressive Update → SWFUS Proof

on:
  pull_request:
    paths:
      - 'app/api/v1/sync/**'
      - 'lib/offline/**'
      - 'models/OfflineSyncEvent.js'
      - 'scripts/validate-apu-progressive-sync.mjs'
      - 'tests/unit/apu-progressive-update.test.mjs'
      - 'docs/apwa/APU_PROGRESSIVE_SYNC_CONTRACT.md'
      - 'package.json'
      - '.github/workflows/apu-progressive-sync-proof.yml'
  push:
    branches:
      - main
    paths:
      - 'app/api/v1/sync/**'
      - 'lib/offline/**'
      - 'models/OfflineSyncEvent.js'
      - 'scripts/validate-apu-progressive-sync.mjs'
      - 'tests/unit/apu-progressive-update.test.mjs'
      - 'docs/apwa/APU_PROGRESSIVE_SYNC_CONTRACT.md'
      - 'package.json'
      - '.github/workflows/apu-progressive-sync-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivesarena-kpgs-progressive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progressive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Canonical Progressive Update / SWFUS unit proof
        run: npm run test:apu

      - name: Introduction-to-MCP contract conformance receipt
        run: npm run validate:apu-sync

      - name: Production compiler typecheck
        run: npm run typecheck

      - name: Production build integration
        run: npm run build

      - name: Upload KPGS progressive proof receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: fivesarena-kpgs-progressive-proof-${{ github.sha }}
          path: .kpgs/receipts/apu-progressive-sync.json
          if-no-files-found: ignore
          retention-days: 14
