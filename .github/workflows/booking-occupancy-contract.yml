name: Booking Occupancy Contract

on:
  push:
    branches:
      - forge/atomic-booking-slot-invariant
  pull_request:
    paths:
      - 'models/Booking.js'
      - 'models/BookingSlot.js'
      - 'lib/bookings/bookingOccupancy.js'
      - 'lib/bookings/bookingOccupancySlots.mjs'
      - 'app/api/bookings/**'
      - 'app/api/admin/bookings/**'
      - 'scripts/validate-booking-occupancy-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/booking-occupancy-contract.yml'

permissions:
  contents: read

jobs:
  occupancy-contract:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate slot and route contract
        run: npm run validate:booking-occupancy

      - name: Syntax-check authoritative server surfaces
        run: |
          node --check models/Booking.js
          node --check models/BookingSlot.js
          node --check lib/bookings/bookingOccupancy.js
          node --check lib/bookings/bookingOccupancySlots.mjs
          node --check app/api/bookings/route.js
          node --check app/api/bookings/guest/route.js
          node --check 'app/api/bookings/[id]/route.js'
          node --check 'app/api/admin/bookings/[id]/route.js'

      - name: Install locked dependencies
        run: npm ci

      - name: Production build
        run: npm run build
